name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The v2.2.0 release flags TypeScript `import type` as unused; main has the fix, so build from main.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-directories: ~/.cargo/bin
      - name: Install codopsy (main)
        run: command -v codopsy || cargo install --git https://github.com/O6lvl4/codopsy.git --locked
      - name: Quality gate (rank A, no warnings)
        run: codopsy analyze ./src --fail-on-warning
